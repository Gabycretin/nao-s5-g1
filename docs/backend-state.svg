<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="backend-state-title backend-state-desc">
      <title id="backend-state-title">Machine à états — cycle de vie d'une partie</title>
      <desc id="backend-state-desc">Machine à états montrant une partie créée en statut LOBBY, où les joueurs rejoignent et l'hôte configure les rôles, jusqu'à la transition start() qui passe en ROLES_ASSIGNED une fois les conditions remplies ; le site n'intervient plus ensuite.</desc>
      <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ================= TRANSITIONS (drawn first) ================= -->

      <!-- Start dot -> LOBBY -->
      <line x1="66" y1="280" x2="120" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Self-loop A on LOBBY: join() -->
      <path d="M 160 220 C 160 162, 220 162, 220 220" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Self-loop B on LOBBY: update_roles_config() -->
      <path d="M 240 220 C 240 162, 300 162, 300 220" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- LOBBY -> ROLES_ASSIGNED (accent, headline transition) -->
      <line x1="340" y1="280" x2="560" y2="280" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- ROLES_ASSIGNED -> End dot -->
      <line x1="780" y1="280" x2="866" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ================= ANNOTATION CALLOUT ================= -->
      <text x="900" y="46" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">toute action refusée laisse l'état inchangé</text>
      <path d="M 830 54 Q 650 66 452 268" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="452" cy="268" r="2" fill="#2d3142"/>

      <!-- ================= LABELS ================= -->

      <rect x="70" y="260" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="100" y="269" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CREATE()</text>

      <rect x="150" y="146" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="190" y="156" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">JOIN() / ADD</text>

      <rect x="222" y="146" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="270" y="156" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROLES() [HOST]</text>

      <rect x="390" y="256" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="450" y="266" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">START() / ASSIGN</text>

      <rect x="792" y="260" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="828" y="269" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FIN DU SITE</text>

      <!-- ================= START DOT ================= -->
      <circle cx="60" cy="280" r="6" fill="#2d3142"/>

      <!-- ================= STATE: LOBBY ================= -->
      <rect x="120" y="220" width="220" height="120" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="128" y="228" width="46" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="151" y="237" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="230" y="272" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LOBBY</text>
      <text x="230" y="290" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">joueurs rejoignent</text>
      <text x="230" y="304" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hôte configure les rôles</text>

      <!-- ================= STATE: ROLES_ASSIGNED (focal) ================= -->
      <rect x="560" y="220" width="220" height="120" rx="8" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <rect x="568" y="228" width="46" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="591" y="237" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="670" y="272" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ROLES_ASSIGNED</text>
      <text x="670" y="290" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rôles tirés au sort</text>
      <text x="670" y="304" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">site hors-jeu · relais NAO</text>

      <!-- ================= END DOT ================= -->
      <circle cx="880" cy="280" r="8" fill="none" stroke="#2d3142" stroke-width="1"/>
      <circle cx="880" cy="280" r="5" fill="#2d3142"/>

      <!-- ================= LEGEND ================= -->
      <line x1="40" y1="420" x2="920" y2="420" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="436" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGENDE</text>

      <rect x="40" y="454" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="60" y="462" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">État</text>

      <rect x="130" y="454" width="14" height="10" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="150" y="462" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">État visé (focal)</text>

      <circle cx="300" cy="459" r="5" fill="#2d3142"/>
      <text x="316" y="462" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Début (create)</text>

      <circle cx="440" cy="459" r="7" fill="none" stroke="#2d3142" stroke-width="1"/>
      <circle cx="440" cy="459" r="4" fill="#2d3142"/>
      <text x="456" y="462" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Fin (hors site)</text>

      <line x1="580" y1="459" x2="608" y2="459" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="616" y="462" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Transition clé</text>
    </svg>