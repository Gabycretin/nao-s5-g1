      <text x="610" y="481" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MANAGES</text>

      <rect x="810" y="298" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="828" y="307" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">USES</text>

