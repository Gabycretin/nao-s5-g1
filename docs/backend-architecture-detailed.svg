<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="backend-arch-detailed-title backend-arch-detailed-desc">
      <title id="backend-arch-detailed-title">Architecture backend détaillée — carte des modules</title>
      <desc id="backend-arch-detailed-desc">Diagramme d'architecture détaillé montrant, par fichier, la zone Client, la zone API FastAPI (games.py, ws.py, deps.py) et la zone Domaine et Support (auth.py, GameService, le modèle de domaine, ConnectionManager et NaoController), avec GameService comme composant focal.</desc>
      <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ================= ZONES (drawn first) ================= -->
      <rect x="44" y="68" width="192" height="112" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="104" y="72" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="134" y="81" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLIENT</text>

      <rect x="324" y="68" width="232" height="472" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="384" y="72" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="440" y="81" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">API · FASTAPI</text>

      <rect x="684" y="68" width="512" height="472" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="828" y="72" width="216" height="12" rx="2" fill="#f5f5f5"/>
      <text x="936" y="81" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DOMAINE &amp; SUPPORT</text>

      <!-- ================= ARROWS ================= -->

      <!-- Client -> games.py : REST (link, straight — same row) -->
      <line x1="220" y1="132" x2="340" y2="132" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- Client <-> ws.py : connect (solid) / push (dashed) — staggered to avoid crossing -->
      <path d="M 113,164 V 440 H 399 Q 407,440 407,448 V 460" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 473,460 V 200 H 175 Q 167,200 167,208 V 164" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- games.py -> deps.py : DEPENDS (same column, straight) -->
      <line x1="440" y1="164" x2="440" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- games.py -> auth.py : ISSUE (straight, same row) -->
      <line x1="540" y1="128" x2="700" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- games.py -> GameService : CALLS (ACCENT — primary flow), ducks under auth.py -->
      <path d="M 540,148 H 650 V 176 H 772 Q 780,176 780,184 V 200" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- games.py -> ConnectionManager : BROADCAST, routes left of the domain column, hops over deps->service -->
      <path d="M 540,160 H 630 V 255 a 8,8 0 0,0 0,16 V 440 H 772 Q 780,440 780,448 V 460" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- deps.py -> auth.py : VERIFY -->
      <path d="M 540,241 H 670 V 164 Q 670,156 678,156 H 700" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- deps.py -> GameService : CALLS (straight, same row) -->
      <line x1="540" y1="263" x2="700" y2="263" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ws.py -> ConnectionManager : MANAGES (straight, same row) -->
      <line x1="540" y1="492" x2="700" y2="492" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- GameService -> Domain Model : USES (straight, same column) -->
      <line x1="800" y1="272" x2="800" y2="340" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- GameService -> NaoController : NOTIFIES (dashed, straight, same row) -->
      <line x1="900" y1="236" x2="1000" y2="236" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

