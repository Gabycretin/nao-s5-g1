<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="backend-sequence-title backend-sequence-desc">
      <title id="backend-sequence-title">Séquence backend — création à la consultation du rôle</title>
      <desc id="backend-sequence-desc">Diagramme de séquence montrant l'hôte qui crée une partie, un joueur qui la rejoint, l'hôte qui démarre la distribution des rôles avec notification à NAO et diffusion WebSocket, puis le joueur qui consulte son rôle secret.</desc>
      <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- LIFELINES — centers: Host 120, Backend 376, Player 632, NAO 888 -->
      <line x1="120" y1="128" x2="120" y2="584" stroke="#2d3142" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="376" y1="128" x2="376" y2="584" stroke="#2d3142" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="632" y1="128" x2="632" y2="584" stroke="#2d3142" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="888" y1="128" x2="888" y2="584" stroke="#2d3142" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ACTIVATION BARS on Backend (the actor doing the work) -->
      <rect x="372" y="160" width="8" height="72" fill="#eb6c36" fill-opacity="0.10" stroke="#eb6c36" stroke-width="0.8"/>
      <rect x="372" y="272" width="8" height="72" fill="#eb6c36" fill-opacity="0.10" stroke="#eb6c36" stroke-width="0.8"/>
      <rect x="372" y="384" width="8" height="160" fill="#eb6c36" fill-opacity="0.10" stroke="#eb6c36" stroke-width="0.8"/>

      <!-- ================= MESSAGES ================= -->

      <!-- M1: Host -> Backend : create (link) -->
      <line x1="120" y1="160" x2="372" y2="160" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M2: Backend self : create_game() -->
      <path d="M 380 176 L 416 176 L 416 208 L 380 208" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M3: Backend -> Host : return token (dashed) -->
      <line x1="372" y1="232" x2="120" y2="232" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- M4: Player -> Backend : join (link) -->
      <line x1="632" y1="272" x2="380" y2="272" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M5: Backend self : join_game() -->
      <path d="M 380 288 L 416 288 L 416 320 L 380 320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M6: Backend -> Player : return token (dashed) -->
      <line x1="380" y1="344" x2="632" y2="344" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- M7: Host -> Backend : start (ACCENT — headline action) -->
      <line x1="120" y1="384" x2="372" y2="384" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- M8: Backend self : start_game() -->
      <path d="M 380 400 L 416 400 L 416 432 L 380 432" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M9: Backend -> NAO : announce_roles_assigned (async, open head, crosses Player's lifeline) -->
      <line x1="380" y1="456" x2="888" y2="456" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <!-- M10: Backend -> Player : WS push roles_assigned (async, open head) -->
      <line x1="380" y1="480" x2="632" y2="480" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>

      <!-- M11: Player -> Backend : GET /me (link) -->
      <line x1="632" y1="520" x2="380" y2="520" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M12: Backend -> Player : return role (ACCENT — headline success) -->
      <line x1="372" y1="544" x2="632" y2="544" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- ================= LABELS ================= -->

      <rect x="192" y="140" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="236" y="150" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /GAMES</text>

      <rect x="424" y="186" width="92" height="12" rx="2" fill="#f5f5f5"/>
      <text x="470" y="196" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CREATE_GAME()</text>

      <rect x="200" y="212" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="238" y="222" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">200 · TOKEN</text>

      <rect x="460" y="252" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="502" y="262" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /JOIN</text>

      <rect x="424" y="298" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="464" y="308" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">JOIN_GAME()</text>

      <rect x="464" y="324" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="502" y="334" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">200 · TOKEN</text>

      <rect x="200" y="364" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="244" y="374" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /START</text>

      <rect x="424" y="410" width="92" height="12" rx="2" fill="#f5f5f5"/>
      <text x="470" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">START_GAME()</text>

      <rect x="596" y="436" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="634" y="446" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NOTIFY NAO</text>

      <rect x="462" y="460" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="506" y="470" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WS: ASSIGNED</text>

      <rect x="464" y="500" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="510" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET /ME</text>

      <rect x="462" y="524" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="534" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">200 · ROLE</text>

      <!-- ================= ACTORS ================= -->

      <!-- Host (external / soft) -->
      <rect x="48" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="72" width="144" height="56" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <rect x="56" y="80" width="28" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="70" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="120" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Host</text>
      <text x="120" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PC de la salle</text>

      <!-- Backend (focal / accent — API + GameService combined) -->
      <rect x="288" y="72" width="176" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="288" y="72" width="176" height="56" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <rect x="296" y="80" width="30" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="311" y="89" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
      <text x="376" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Backend</text>
      <text x="376" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">api/games.py · GameService</text>

      <!-- Player (external / soft) -->
      <rect x="560" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="72" width="144" height="56" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <rect x="568" y="80" width="28" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="582" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="632" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Player</text>
      <text x="632" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">téléphone</text>

      <!-- NAO (optional / dashed) -->
      <rect x="828" y="72" width="120" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="828" y="72" width="120" height="56" rx="6" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="836" y="80" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.22" stroke-width="0.8"/>
      <text x="850" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NAO</text>
      <text x="888" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">NAO</text>
      <text x="888" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stub → NAOqi</text>

      <!-- ================= LEGEND ================= -->
      <line x1="48" y1="608" x2="952" y2="608" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="48" y="624" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGENDE</text>

      <line x1="48" y1="644" x2="76" y2="644" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="84" y="647" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Appel REST</text>

      <line x1="196" y1="644" x2="224" y2="644" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="232" y="647" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Retour</text>

      <line x1="320" y1="644" x2="348" y2="644" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <text x="356" y="647" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Async (WS / NAO)</text>

      <line x1="500" y1="644" x2="528" y2="644" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="536" y="647" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Action / réponse clé</text>

      <rect x="700" y="638" width="4" height="14" fill="#eb6c36" fill-opacity="0.10" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="712" y="647" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Activation Backend</text>

    </svg>