<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="backend-architecture-title backend-architecture-desc">
      <title id="backend-architecture-title">Architecture backend — NAO Loup-Garou</title>
      <desc id="backend-architecture-desc">Diagramme d'architecture montrant les clients (PC hôte et téléphones joueurs) qui traversent la couche API FastAPI, laquelle s'appuie sur l'authentification par jetons, le service de jeu central, le modèle de domaine, la diffusion WebSocket et une couche d'abstraction pour NAO.</desc>
      <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ ARROWS (drawn before boxes) ============ -->

      <!-- Client -> API Layer : REST (link-blue, upper attach point y=241) -->
      <line x1="288" y1="241" x2="384" y2="241" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- API Layer -> Client : WS push (dashed muted, lower attach point y=263) -->
      <line x1="384" y1="263" x2="288" y2="263" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- API Layer -> GameService : primary call (accent) -->
      <line x1="544" y1="252" x2="640" y2="252" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- API Layer -> Auth (vertical, up) -->
      <line x1="464" y1="220" x2="464" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- API Layer -> WS Broadcast / ConnectionManager (vertical, down) -->
      <line x1="464" y1="284" x2="464" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- GameService -> Domain Model (vertical, up) -->
      <line x1="720" y1="220" x2="720" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- GameService -> NaoController (vertical, down, dashed — stub today) -->
      <line x1="720" y1="284" x2="720" y2="352" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- ============ ARROW LABELS ============ -->

      <rect x="318" y="221" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="336" y="230" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REST</text>

      <rect x="308" y="271" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="336" y="280" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WS PUSH</text>

      <rect x="572" y="232" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="592" y="241" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CALLS</text>

      <rect x="472" y="172" width="42" height="12" rx="2" fill="#f5f5f5"/>
      <text x="493" y="181" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TOKEN</text>

      <rect x="472" y="312" width="70" height="12" rx="2" fill="#f5f5f5"/>
      <text x="507" y="321" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BROADCAST</text>

      <rect x="728" y="172" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="746" y="181" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">USES</text>

      <rect x="728" y="312" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="758" y="321" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NOTIFIES</text>

      <!-- ============ NODES ============ -->

      <!-- Client (Input/User) -->
      <rect x="160" y="220" width="128" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="160" y="220" width="128" height="64" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <rect x="168" y="228" width="30" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="183" y="237" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
      <text x="224" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Client</text>
      <text x="224" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PC + téléphones</text>

      <!-- API Layer (Backend) -->
      <rect x="384" y="220" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="384" y="220" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="392" y="228" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="406" y="237" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="464" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">API Layer</text>
      <text x="464" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FastAPI · REST + WS</text>

      <!-- Auth -->
      <rect x="404" y="80" width="120" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="404" y="80" width="120" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="412" y="88" width="34" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="429" y="97" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUTH</text>
      <text x="464" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Auth</text>
      <text x="464" y="130" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">jetons HMAC</text>

      <!-- GameService (FOCAL) -->
      <rect x="640" y="220" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="220" width="160" height="64" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <rect x="648" y="228" width="30" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="663" y="237" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
      <text x="720" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GameService</text>
      <text x="720" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">logique métier</text>

      <!-- WS Broadcast / ConnectionManager (Store/State) -->
      <rect x="392" y="352" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="392" y="352" width="144" height="56" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="400" y="360" width="34" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="417" y="369" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CONN</text>
      <text x="464" y="386" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">WS Broadcast</text>
      <text x="464" y="401" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ConnectionManager</text>

      <!-- Domain Model (Store/State) -->
      <rect x="648" y="80" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="648" y="80" width="144" height="56" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="656" y="88" width="32" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="672" y="97" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DOM</text>
      <text x="720" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Domain Model</text>
      <text x="720" y="130" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Role · Player · Game</text>

      <!-- NaoController (Optional/Async — dashed) -->
      <rect x="648" y="352" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="648" y="352" width="144" height="56" rx="6" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="656" y="360" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.22" stroke-width="0.8"/>
      <text x="670" y="369" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NAO</text>
      <text x="720" y="386" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">NaoController</text>
      <text x="720" y="401" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stub → NAOqi</text>

      <!-- ============ LEGEND ============ -->
      <line x1="40" y1="456" x2="920" y2="456" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="472" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGENDE</text>

      <rect x="40" y="490" width="14" height="10" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="498" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Cœur (focal)</text>

      <rect x="168" y="490" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="188" y="498" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Composant backend</text>

      <rect x="328" y="490" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="348" y="498" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">État / données</text>

      <rect x="468" y="490" width="14" height="10" rx="2" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <text x="488" y="498" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Client</text>

      <rect x="560" y="490" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="580" y="498" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Optionnel (futur)</text>

      <line x1="700" y1="495" x2="728" y2="495" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="736" y="498" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">REST</text>

      <line x1="790" y1="495" x2="818" y2="495" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="826" y="498" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Flux principal</text>
    </svg>